name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Еженедельно в понедельник в 02:00 UTC
  workflow_dispatch:

jobs:
  sast:
    name: SAST — SpotBugs + FindSecBugs
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs
        run: cd backend && mvn spotbugs:check -Dmaven.test.skip=true --no-transfer-progress
        continue-on-error: true

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 30

  sca:
    name: SCA — Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven dependency check
        run: cd backend && mvn dependency-check:check --no-transfer-progress
        continue-on-error: true

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

  trivy:
    name: Trivy — Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          # Without this, 'table' format only prints to the job log — the
          # "Upload Trivy results" step below always found nothing to upload
          # (silently, since if-no-files-found defaults to warn).
          output: 'trivy-results.txt'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          # Trivy resolves pom.xml's parent/dependency versions by walking Maven
          # Central live — every scheduled run for the past month failed with
          # "429 Too Many Requests" from repo.maven.apache.org, not an actual
          # vulnerability finding. Java deps are already covered by the SCA job
          # above (OWASP dependency-check, its own NVD database, no live Maven
          # Central walk) — skip pom.xml here rather than fight Trivy's resolver.
          skip-files: 'backend/pom.xml'

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.txt
          retention-days: 30
