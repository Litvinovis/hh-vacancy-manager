name: Build & Deploy — HH Vacancy Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: cd backend && mvn package -B

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hh-gui-jar
          path: backend/target/hh-gui-*.jar
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-25-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Build
        run: cd backend && mvn package -B -DskipTests

      # Both sidecars keep a long-lived browser session (DDoS-Guard/hh.ru cookies,
      # the logged-in Telegram Web client) that a restart tears down and has to warm
      # back up from scratch. Restarting them on every push — even ones that only
      # touch backend/ — was starving tg-scraper of any time to actually scrape
      # between restarts on days with a fast merge cadence. Only restart a sidecar
      # when its own files (or its systemd unit) actually changed.
      - name: Detect changed paths
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable base commit (force-push or manual run) — deploying both sidecars to be safe"
            echo "scraper=true" >> "$GITHUB_OUTPUT"
            echo "tg_scraper=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(scraper/|scripts/hh-scraper\.service)'; then
            echo "scraper=true" >> "$GITHUB_OUTPUT"
          else
            echo "scraper=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(tg-scraper/|scripts/tg-scraper\.service)'; then
            echo "tg_scraper=true" >> "$GITHUB_OUTPUT"
          else
            echo "tg_scraper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy scraper sidecar
        if: steps.changes.outputs.scraper == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          DEPLOY_DIR=/opt/hh-gui/scraper
          NODE_BIN_DIR=/home/rover/.nvm/versions/node/v24.22.3/bin
          export PATH="${NODE_BIN_DIR}:${PATH}"
          NPM_BIN="${NODE_BIN_DIR}/npm"

          sudo mkdir -p ${DEPLOY_DIR}
          sudo cp scraper/package.json scraper/package-lock.json scraper/server.js ${DEPLOY_DIR}/
          # Only the files just copied — NOT -R over ${DEPLOY_DIR}. That recursed into
          # profile-data/, Chromium's live browser profile, whose HTTP cache had grown to
          # 1.6 GB of hundreds of thousands of files held open by the running browser.
          # Walking that on every deploy is what made this step flaky (it failed ~3× in
          # one day and needed `gh run rerun --failed`). node_modules is created by the
          # npm ci below, which already runs as rover.
          sudo chown rover:rover ${DEPLOY_DIR} ${DEPLOY_DIR}/package.json ${DEPLOY_DIR}/package-lock.json ${DEPLOY_DIR}/server.js

          # Chromium never bounds its own disk cache, and this profile is deliberately
          # long-lived (DDoS-Guard clearance + hh.ru session cookies must survive across
          # restarts — see PROFILE_DIR in server.js). Left alone it reached 1.6 GB, of
          # which 1.65 GB was regenerable HTTP/code cache and only ~7 MB was the cookies
          # and storage worth keeping. Purge the caches only, and only past a threshold,
          # so a normal deploy keeps its warm cache.
          PROFILE_DEFAULT="${DEPLOY_DIR}/profile-data/Default"
          if [ -d "$PROFILE_DEFAULT" ]; then
            PROFILE_MB=$(sudo du -sm "${DEPLOY_DIR}/profile-data" | cut -f1)
            if [ "$PROFILE_MB" -gt 500 ]; then
              echo "Профиль браузера разросся до ${PROFILE_MB} МБ — чистим кэш (куки не трогаем)"
              sudo systemctl stop hh-scraper || true
              sudo rm -rf "$PROFILE_DEFAULT/Cache" "$PROFILE_DEFAULT/Code Cache"
              echo "После чистки: $(sudo du -sh ${DEPLOY_DIR}/profile-data | cut -f1)"
            fi
          fi

          cd ${DEPLOY_DIR}
          # --ignore-scripts: package.json's own postinstall runs "playwright install
          # --with-deps", which apt-get updates for — and a broken/unrelated third-party
          # apt repo (e.g. packages.cloudflare.com returning 530) then fails the whole
          # npm ci. The explicit install below (no --with-deps) is what we actually want.
          ${NPM_BIN} ci --omit=dev --ignore-scripts
          ${NPM_BIN} exec playwright install chromium
          # Note: playwright install --with-deps intentionally NOT used — apt is brittle
          # on this server (dpkg can be broken by other packages like grafana). All
          # system library deps are pre-installed.

          # Install/refresh the systemd unit
          sudo cp "$GITHUB_WORKSPACE/scripts/hh-scraper.service" /etc/systemd/system/hh-scraper.service
          sudo systemctl daemon-reload
          sudo systemctl enable hh-scraper
          sudo systemctl restart hh-scraper

      - name: Deploy tg-scraper sidecar
        if: steps.changes.outputs.tg_scraper == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          DEPLOY_DIR=/opt/hh-gui/tg-scraper
          NODE_BIN_DIR=/home/rover/.nvm/versions/node/v24.22.3/bin
          export PATH="${NODE_BIN_DIR}:${PATH}"
          NPM_BIN="${NODE_BIN_DIR}/npm"

          sudo mkdir -p ${DEPLOY_DIR}
          # Same reasoning as the hh-scraper step above: only the files just copied,
          # NOT -R over ${DEPLOY_DIR} — profile-data/ holds the logged-in Telegram
          # session (IndexedDB/localStorage), which must survive every deploy untouched.
          sudo cp tg-scraper/package.json tg-scraper/package-lock.json tg-scraper/server.js ${DEPLOY_DIR}/
          sudo chown rover:rover ${DEPLOY_DIR} ${DEPLOY_DIR}/package.json ${DEPLOY_DIR}/package-lock.json ${DEPLOY_DIR}/server.js

          cd ${DEPLOY_DIR}
          ${NPM_BIN} ci --omit=dev --ignore-scripts
          ${NPM_BIN} exec playwright install chromium

          sudo cp "$GITHUB_WORKSPACE/scripts/tg-scraper.service" /etc/systemd/system/tg-scraper.service
          sudo systemctl daemon-reload
          sudo systemctl enable tg-scraper
          sudo systemctl restart tg-scraper

      - name: Deploy VK token refresher
        run: |
          # Живёт рядом с tg-scraper, чтобы брать его Playwright и Chromium; профиль
          # браузера (/opt/hh-gui/vk-session, залогиненная сессия VK) деплой не трогает.
          sudo cp scripts/vk-token-refresh.js /opt/hh-gui/tg-scraper/vk-token-refresh.js
          sudo chown rover:rover /opt/hh-gui/tg-scraper/vk-token-refresh.js
          sudo cp scripts/vk-token-refresh.service scripts/vk-token-refresh.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable vk-token-refresh.timer
          # restart, а не только --now: уже запущенный таймер без перезапуска держит
          # расписание, вычисленное по старому OnCalendar.
          sudo systemctl restart vk-token-refresh.timer

      - name: Deploy ops scripts (watchdogs, session backup, weekly scraper restart)
        run: |
          # Раньше эти скрипты и юниты жили только на сервере — после отказа SSD 08.09.2026
          # их восстанавливали вручную из бэкапа. Теперь источник истины — scripts/ops/.
          sudo install -m 755 scripts/ops/hh-scraper-watchdog.sh scripts/ops/tg-scraper-watchdog.sh \
            scripts/ops/backup-tg-session.sh /usr/local/bin/
          sudo install -m 644 scripts/ops/*.service scripts/ops/*.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable --now hh-scraper-watchdog.timer tg-scraper-watchdog.timer scraper-restart.timer
          # Копия сессий пишет на внешний диск — таймер включаем, только если он смонтирован.
          if mountpoint -q /mnt/storage; then sudo systemctl enable --now backup-tg-session.timer; fi

      - name: Deploy
        run: |
          DEPLOY_DIR=/opt/hh-gui
          JAR_NAME=hh-gui.jar

          sudo mkdir -p "$DEPLOY_DIR"

          if [ ! -f "$DEPLOY_DIR/config/profiles/default.yaml" ]; then
            sudo cp -r config "$DEPLOY_DIR/"
          fi

          JAR_PATH="$DEPLOY_DIR/$JAR_NAME"
          if [ -f "$JAR_PATH" ]; then
            sudo cp "$JAR_PATH" "$JAR_PATH.backup.$(date +%Y%m%d_%H%M%S)"
            # Храним пять копий: каждая занимает около 40 МБ.
            ls -t "$JAR_PATH".backup.* | tail -n +6 | sudo xargs -r rm -f
          fi

          # Работающая JVM держит старый JAR открытым до завершения. Замена через
          # rename сохраняет его содержимое и даёт новому процессу целый архив.
          STAGED_JAR=$(sudo mktemp "$JAR_PATH.XXXXXX")
          trap 'sudo rm -f -- "$STAGED_JAR"' EXIT
          sudo install -m 644 backend/target/hh-gui-*.jar "$STAGED_JAR"
          sudo mv -fT -- "$STAGED_JAR" "$JAR_PATH"

          # NB: no schema migration here. SchemaMigrator (@PostConstruct, see its javadoc)
          # owns that now — it checks each column before adding it and covers every column
          # added since, which this block never did: it was frozen on the 2026-06 set and
          # knew nothing about dedup_key/novelty_color/queued_publish_at/run_priority etc.
          # It also wrote to the live WAL database from a second process while the old app
          # was still running, for no benefit.

      - name: Smoke test
        run: |
          echo "Waiting for services to start..."
          READY=false
          if sudo systemctl restart hh-gui; then
            for i in $(seq 1 10); do
              if sudo systemctl is-active --quiet hh-gui \
                && HTTP_CODE=$(curl -s --max-time 3 -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health) \
                && [ "$HTTP_CODE" = 200 ]; then
                echo "✅ hh-gui ready on attempt $i"
                READY=true
                break
              fi
              echo "  попытка $i/10 — ждём hh-gui..."
              sleep 3
            done
          fi

          if [ "$READY" != true ]; then
            echo "❌ App failed to start, rolling back..."
            JAR_PATH=/opt/hh-gui/hh-gui.jar
            LATEST_BACKUP=$({ ls -t "$JAR_PATH".backup.* 2>/dev/null || true; } | sed -n '1p')
            if [ -n "$LATEST_BACKUP" ]; then
              # При откате процесс тоже может ещё держать текущий JAR открытым.
              STAGED_JAR=$(sudo mktemp "$JAR_PATH.XXXXXX")
              trap 'sudo rm -f -- "$STAGED_JAR"' EXIT
              sudo install -m 644 "$LATEST_BACKUP" "$STAGED_JAR"
              sudo mv -fT -- "$STAGED_JAR" "$JAR_PATH"
              sudo systemctl restart hh-gui
            fi
            exit 1
          fi
          echo "✅ HH Vacancy Manager is running"

          SCRAPER_STATUS=$(sudo systemctl is-active hh-scraper)
          if [ "$SCRAPER_STATUS" != "active" ]; then
            echo "❌ Scraper sidecar failed to start (see: journalctl -u hh-scraper)"
            exit 1
          fi
          echo "✅ Scraper sidecar is running"

          SCRAPER_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8095/health)
          if [ "$SCRAPER_HTTP_CODE" != "200" ]; then
            echo "❌ Scraper health check failed (code: $SCRAPER_HTTP_CODE)"
            exit 1
          fi
          echo "✅ Scraper health check passed (code: $SCRAPER_HTTP_CODE)"

          TG_SCRAPER_STATUS=$(sudo systemctl is-active tg-scraper)
          if [ "$TG_SCRAPER_STATUS" != "active" ]; then
            echo "❌ tg-scraper sidecar failed to start (see: journalctl -u tg-scraper)"
            exit 1
          fi
          echo "✅ tg-scraper sidecar is running"

          TG_SCRAPER_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8096/health)
          if [ "$TG_SCRAPER_HTTP_CODE" != "200" ]; then
            echo "❌ tg-scraper health check failed (code: $TG_SCRAPER_HTTP_CODE)"
            exit 1
          fi
          echo "✅ tg-scraper health check passed (code: $TG_SCRAPER_HTTP_CODE)"

      - name: Notify Telegram
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *HH Vacancy Manager* задеплоен%0Aветка: \`${{ github.ref_name }}\`%0Aкоммит: ${{ github.sha }}"
          else
            MSG="❌ *HH Vacancy Manager* — деплой упал%0Aсмотри: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null
